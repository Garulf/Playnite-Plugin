body:
  - type: textBlock
    attributes:
      name: description
      description: >
        Search and launch your Playnite library.
  - type: input
    attributes:
      name: playnite_path
      label: "Playnite Data Directory:"
      defaultValue: "%APPDATA%\\Playnite"
      description: Playnite data directory (the folder containing "library"). Change this for portable installs.
  - type: input
    attributes:
      name: library_server_port
      label: "Live Library Server Port:"
      defaultValue: "38217"
      description: Port the playnite-library-server extension listens on. Only needed if you changed it from the extension's default.
  - type: checkbox
    attributes:
      name: show_hidden
      label: "Show Hidden Games"
      defaultValue: "false"
      description: Include games marked hidden in Playnite.
  - type: checkbox
    attributes:
      name: hide_uninstalled
      label: "Hide Uninstalled Games"
      defaultValue: "true"
      description: Only show installed games in search results.
