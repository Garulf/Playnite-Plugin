name: release-please

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

env:
  PYTHON_VER: "3.12"

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release-please.outputs.release_created }}
      tag_name: ${{ steps.release-please.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v5
        id: release-please
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  package:
    name: Package and upload release archive
    runs-on: ubuntu-latest
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created }}
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
          fetch-depth: 0

      - name: Build archive
        id: build
        uses: ./.github/actions/build-plugin
        with:
          version: ${{ needs.release-please.outputs.tag_name }}
          python-version: ${{ env.PYTHON_VER }}

      - name: Upload archive to release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ needs.release-please.outputs.tag_name }}" "${{ steps.build.outputs.zip_path }}" --clobber

      - name: Delete release PR pre-releases
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release list --limit 100 --json tagName,isPrerelease \
            --jq '.[] | select(.isPrerelease and (.tagName | endswith("-pre"))) | .tagName' |
            while read -r tag; do
              gh release delete "$tag" --cleanup-tag --yes
            done

  prerelease:
    name: Publish release PR pre-release
    runs-on: ubuntu-latest
    needs: release-please
    if: ${{ github.ref == 'refs/heads/main' && needs.release-please.outputs.release_created != 'true' }}
    concurrency:
      group: prerelease
      cancel-in-progress: true
    permissions:
      contents: write
      pull-requests: read

    steps:
      - name: Find release PR
        id: pr
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          pr="$(gh pr list --repo "$GITHUB_REPOSITORY" --state open --label "autorelease: pending" \
            --json number,headRefName,body --jq '.[0] // empty')"
          if [ -z "$pr" ]; then
            echo "No open release PR"
            exit 0
          fi

          number="$(jq -r .number <<< "$pr")"
          branch="$(jq -r .headRefName <<< "$pr")"
          version="$(gh api "repos/$GITHUB_REPOSITORY/contents/data/plugin.json?ref=$branch" \
            -H "Accept: application/vnd.github.raw" | jq -r .Version)"
          jq -r .body <<< "$pr" | awk '/^---$/ { section++; next } section == 1' > "$RUNNER_TEMP/notes.md"
          {
            echo "number=$number"
            echo "version=$version"
            echo "tag=v$version-pre"
          } >> "$GITHUB_OUTPUT"

      - name: Checkout
        if: ${{ steps.pr.outputs.number }}
        uses: actions/checkout@v7

      - name: Set release PR version
        if: ${{ steps.pr.outputs.number }}
        shell: bash
        run: |
          jq --arg version "${{ steps.pr.outputs.version }}" '.Version = $version' data/plugin.json > "$RUNNER_TEMP/plugin.json"
          mv "$RUNNER_TEMP/plugin.json" data/plugin.json

      - name: Build archive
        if: ${{ steps.pr.outputs.number }}
        id: build
        uses: ./.github/actions/build-plugin
        with:
          version: ${{ steps.pr.outputs.version }}-pre
          python-version: ${{ env.PYTHON_VER }}

      - name: Replace pre-release
        if: ${{ steps.pr.outputs.number }}
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.pr.outputs.tag }}
        run: |
          gh release list --limit 100 --json tagName,isPrerelease \
            --jq '.[] | select(.isPrerelease and (.tagName | endswith("-pre"))) | .tagName' |
            while read -r tag; do
              gh release delete "$tag" --cleanup-tag --yes
            done

          gh release create "$TAG" "${{ steps.build.outputs.zip_path }}" \
            --prerelease \
            --latest=false \
            --target "$GITHUB_SHA" \
            --title "$TAG" \
            --notes-file "$RUNNER_TEMP/notes.md"
