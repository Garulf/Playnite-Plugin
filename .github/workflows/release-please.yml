name: release-please

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

env:
  PYTHON_VER: "3.12"

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release-please.outputs.release_created }}
      tag_name: ${{ steps.release-please.outputs.tag_name }}
      prs_created: ${{ steps.release-please.outputs.prs_created }}
      pr: ${{ steps.release-please.outputs.pr }}
    steps:
      - uses: googleapis/release-please-action@v5
        id: release-please
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  package:
    name: Package and upload release archive
    runs-on: ubuntu-latest
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created }}
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
          fetch-depth: 0

      - name: Build archive
        id: build
        uses: ./.github/actions/build-plugin
        with:
          version: ${{ needs.release-please.outputs.tag_name }}
          python-version: ${{ env.PYTHON_VER }}

      - name: Upload archive to release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ needs.release-please.outputs.tag_name }}" "${{ steps.build.outputs.zip_path }}" --clobber

      - name: Delete release PR pre-releases
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release list --limit 100 --json tagName,isPrerelease \
            --jq '.[] | select(.isPrerelease and (.tagName | endswith("-pre"))) | .tagName' |
            while read -r tag; do
              gh release delete "$tag" --cleanup-tag --yes
            done

  prerelease:
    name: Publish release PR pre-release
    runs-on: ubuntu-latest
    needs: release-please
    if: ${{ needs.release-please.outputs.prs_created == 'true' }}
    permissions:
      contents: write

    steps:
      - name: Checkout release PR branch
        uses: actions/checkout@v7
        with:
          ref: ${{ fromJSON(needs.release-please.outputs.pr).headBranchName }}

      - name: Read version
        id: version
        shell: bash
        run: |
          version="$(jq -r .Version data/plugin.json)"
          {
            echo "version=$version"
            echo "tag=v$version-pre"
            echo "sha=$(git rev-parse HEAD)"
          } >> "$GITHUB_OUTPUT"

      - name: Build archive
        id: build
        uses: ./.github/actions/build-plugin
        with:
          version: ${{ steps.version.outputs.version }}-pre
          python-version: ${{ env.PYTHON_VER }}

      - name: Replace pre-release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ fromJSON(needs.release-please.outputs.pr).number }}
        run: |
          gh release list --limit 100 --json tagName,isPrerelease \
            --jq '.[] | select(.isPrerelease and (.tagName | endswith("-pre"))) | .tagName' |
            while read -r tag; do
              gh release delete "$tag" --cleanup-tag --yes
            done

          gh release create "${{ steps.version.outputs.tag }}" "${{ steps.build.outputs.zip_path }}" \
            --prerelease \
            --latest=false \
            --target "${{ steps.version.outputs.sha }}" \
            --title "${{ steps.version.outputs.tag }}" \
            --notes "Build of release PR #$PR_NUMBER at ${{ steps.version.outputs.sha }}. Replaced whenever the release PR updates and deleted once it is released."
