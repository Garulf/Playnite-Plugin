name: release-please

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

env:
  PYTHON_VER: "3.12"

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release-please.outputs.release_created }}
      tag_name: ${{ steps.release-please.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release-please
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  package:
    name: Package and upload release archive
    runs-on: ubuntu-latest
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created }}
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VER }}

      - name: Stage build files
        id: stage
        shell: bash
        run: |
          build_dir="$RUNNER_TEMP/build"
          mkdir -p "$build_dir"

          cp -r src/. "$build_dir/"
          cp data/icon.png "$build_dir/"
          cp data/plugin.json "$build_dir/"
          cp data/SettingsTemplate.yaml "$build_dir/"
          cp LICENSE "$build_dir/"

          site_dir="$build_dir/plugin/site-packages"
          mkdir -p "$site_dir"

          echo "build_dir=$build_dir" >> "$GITHUB_OUTPUT"
          echo "site_dir=$site_dir" >> "$GITHUB_OUTPUT"

      - name: Install requirements into build/lib
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt --target "${{ steps.stage.outputs.site_dir }}"

      - name: Create release archive
        id: archive
        shell: bash
        run: |
          repo_name="${{ github.event.repository.name }}"
          version="${{ needs.release-please.outputs.tag_name }}"
          version="${version#v}"
          zip_name="${repo_name}-${version}.zip"
          zip_path="$RUNNER_TEMP/$zip_name"

          (
            cd "${{ steps.stage.outputs.build_dir }}"
            zip -r "$zip_path" .
          )

          echo "zip_path=$zip_path" >> "$GITHUB_OUTPUT"

      - name: Upload archive to release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ needs.release-please.outputs.tag_name }}" "${{ steps.archive.outputs.zip_path }}" --clobber
