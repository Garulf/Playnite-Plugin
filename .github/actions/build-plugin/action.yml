name: Build plugin archive
description: Stage the plugin with vendored dependencies and zip it

inputs:
  version:
    description: Version used in the archive file name
    required: true
  python-version:
    description: Python version used to install dependencies
    required: true

outputs:
  zip_path:
    description: Path to the built archive
    value: ${{ steps.archive.outputs.zip_path }}

runs:
  using: composite
  steps:
    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: ${{ inputs.python-version }}

    - name: Stage build files
      id: stage
      shell: bash
      run: |
        build_dir="$RUNNER_TEMP/build"
        mkdir -p "$build_dir"

        cp -r src/. "$build_dir/"
        cp data/icon.png "$build_dir/"
        cp data/plugin.json "$build_dir/"
        cp data/SettingsTemplate.yaml "$build_dir/"
        cp LICENSE "$build_dir/"

        site_dir="$build_dir/plugin/site-packages"
        mkdir -p "$site_dir"

        echo "build_dir=$build_dir" >> "$GITHUB_OUTPUT"
        echo "site_dir=$site_dir" >> "$GITHUB_OUTPUT"

    - name: Install requirements into build/lib
      shell: bash
      run: |
        python -m pip install --upgrade pip
        python -m pip install -r requirements.txt --target "${{ steps.stage.outputs.site_dir }}"

    - name: Create archive
      id: archive
      shell: bash
      run: |
        version="${{ inputs.version }}"
        zip_name="${{ github.event.repository.name }}-${version#v}.zip"
        zip_path="$RUNNER_TEMP/$zip_name"

        (
          cd "${{ steps.stage.outputs.build_dir }}"
          zip -r "$zip_path" .
        )

        echo "zip_path=$zip_path" >> "$GITHUB_OUTPUT"
